name: "🚀 Infrastructure Pipeline"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: "Terraform Format and Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure

      - name: Parse local deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'infrastructure/environments/scribeba/scripts/deploy-lightsail.ps1',
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Mock local deployment payload and cleanup
        shell: pwsh
        run: ./infrastructure/environments/scribeba/scripts/test-deploy-lightsail.ps1

      - name: Initialize and validate environment roots
        run: |
          for dir in infrastructure/bootstrap/state infrastructure/environments/dev infrastructure/environments/scribeba; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate -no-color
          done
